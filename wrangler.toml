name = "tix-bookings"
main = "src/worker.js"
compatibility_date = "2026-11-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "tix-bookings"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
APP_NAME = "Tix"
